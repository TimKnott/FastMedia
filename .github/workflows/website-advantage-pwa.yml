name: Website Advantage PWA manifest inspection
on:
  workflow_dispatch:
  push:
    branches:
      - feature/website-advantage-pwa-audit-20261117
  pull_request:
    paths:
      - 'scripts/website_advantage_pwa_audit.py'
      - 'scripts/test_website_advantage_pwa_audit.py'
      - '.github/workflows/website-advantage-pwa.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate script
        run: |
          python -m py_compile scripts/website_advantage_pwa_audit.py
          python -m unittest discover -s scripts -p 'test_website_advantage_pwa_audit.py'
      - name: Inspect public PWA manifest links
        run: python scripts/website_advantage_pwa_audit.py --output website-advantage-pwa-audit.json
      - name: Save point-in-time evidence
        uses: actions/upload-artifact@v4
        with:
          name: website-advantage-pwa-manifest-evidence
          path: website-advantage-pwa-audit.json
          retention-days: 14
