name: Website Advantage Super Admin shell
on:
  push:
    branches:
      - feature/website-advantage-admin-shell-20261117
  pull_request:
    paths:
      - 'src/pages/admin/AdminWebsiteAdvantage.tsx'
      - 'src/App.tsx'
      - 'src/components/admin/AdminSidebar.tsx'
      - '.github/workflows/website-advantage-admin.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Static release regression tests
        run: bunx vitest run src/pages/admin/AdminWebsiteAdvantage.test.ts src/lib/websiteAdvantageAudit.test.ts src/components/admin/ProtectedRoute.test.tsx src/lib/websiteAdvantageDiscovery.test.ts
      - name: Validate public audit Python syntax
        run: python -m py_compile scripts/website_advantage_public_audit.py
      - name: Offline public audit security tests
        run: python -m unittest discover -s scripts -p 'test_website_advantage_public_audit.py'
      - name: Offline approved image verification tests
        run: python -m unittest discover -s scripts -p 'test_website_advantage_image_verify.py'
      - name: Discovery audit offline tests and syntax
        run: |
          python -m py_compile scripts/website_advantage_discovery_audit.py
          python -m unittest discover -s scripts -p 'test_website_advantage_discovery_audit.py'
      - name: One-time public discovery-surface sampling
        run: python scripts/website_advantage_discovery_audit.py --output website-advantage-discovery.json
      - name: Upload bounded discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: website-advantage-discovery-once
          path: website-advantage-discovery.json
          retention-days: 14
      - name: Build
        run: bun run build
      - name: Verify onboarding and quality gates
        run: |
          grep -q 'Getting started' src/pages/admin/AdminWebsiteAdvantage.tsx
          grep -q 'Professional release checklist' src/pages/admin/AdminWebsiteAdvantage.tsx
          grep -q 'aria-expanded' src/pages/admin/AdminWebsiteAdvantage.tsx
          grep -q 'Not verified' src/pages/admin/AdminWebsiteAdvantage.tsx
      - name: Check route restriction and no external write controls
        run: |
          grep -q 'ProtectedRoute minRole="super_admin"' src/App.tsx
          grep -q 'website-advantage' src/App.tsx
          grep -q 'Not verified' src/pages/admin/AdminWebsiteAdvantage.tsx
