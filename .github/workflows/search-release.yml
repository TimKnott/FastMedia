name: FastMedia search release checks
on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - '.github/workflows/search-release.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - '.github/workflows/search-release.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  search-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: python3 scripts/check-search-release.py
      - if: github.event_name == 'workflow_dispatch'
        run: python3 scripts/check-search-release.py --live
