name: FastMedia approved social sharing image
on:
  push:
    branches:
      - fix/fastmedia-approved-social-image-20261117
  pull_request:
    paths:
      - 'scripts/seo-routes.ts'
      - 'scripts/prerender.ts'
      - 'src/pages/Index.tsx'
      - '.github/workflows/fastmedia-approved-social-image.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Build production and prerender SEO
        run: bun run build
      - name: Assert generated homepage uses approved image once
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('dist/index.html', 'utf8');
          const expected = 'https://media.base44.com/images/public/69df8fa5a94d72ab00654daf/ced7a393f_fastmedia-social-approved.jpg';
          const og = [...html.matchAll(/<meta[^>]+property="og:image"[^>]+>/g)].map(m=>m[0]);
          const twitter = [...html.matchAll(/<meta[^>]+name="twitter:image"[^>]+>/g)].map(m=>m[0]);
          if (og.length !== 1 || twitter.length !== 1) throw Error('Expected one OG and one Twitter image tag');
          if (!og[0].includes(expected) || !twitter[0].includes(expected)) throw Error('Generated homepage does not use approved image');
          if (og[0].includes('www.fastmedia.pro/og-image.jpg')) throw Error('Legacy OG image remains');
          console.log('Approved social image confirmed in prerendered homepage');
          NODE
