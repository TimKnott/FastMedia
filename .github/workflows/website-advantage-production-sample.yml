name: Website Advantage production read-only verification
on:
  push:
    branches:
      - audit/website-advantage-live-release-20261117
  pull_request:
    paths:
      - '.github/workflows/website-advantage-production-sample.yml'
permissions:
  contents: read
jobs:
  public-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Public homepage metadata and image comparisons
        run: python scripts/website_advantage_public_audit.py --output website-advantage-live-metadata.json
      - name: Approved image HTTP and dimension verification
        run: python scripts/website_advantage_image_verify.py --output website-advantage-live-images.json
      - name: Robots sitemap and optional AI guidance
        run: python scripts/website_advantage_discovery_audit.py --output website-advantage-live-discovery.json
      - name: SevenHourTeacher public DNS and HTTPS diagnostics
        run: python scripts/website_advantage_sevenhourteacher_diagnostic.py
      - name: Check anonymous admin route in headless Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || true)"
          if [[ -z "$CHROME" ]]; then
            echo "Chrome unavailable; anonymous browser check NOT VERIFIED"
            echo "unavailable" > anonymous-admin-status.txt
          else
            timeout 70 "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --disable-extensions --incognito --window-size=1365,900 \
              --virtual-time-budget=12000 --dump-dom \
              https://www.fastmedia.pro/admin/website-advantage \
              > anonymous-admin.html 2> chrome-stderr.txt || true
            if grep -q 'data-testid="website-advantage-admin"' anonymous-admin.html; then
              echo "FAIL: Super Admin dashboard rendered anonymously"
              echo "anonymous-visible" > anonymous-admin-status.txt
              exit 1
            fi
            echo "Anonymous dashboard content not rendered (login/loading state needs visual review)"
            echo "not-rendered" > anonymous-admin-status.txt
          fi
      - name: Upload read-only evidence
        uses: actions/upload-artifact@v4
        with:
          name: website-advantage-production-audit-20261117
          path: |
            website-advantage-live-metadata.json
            website-advantage-live-images.json
            website-advantage-live-discovery.json
            anonymous-admin-status.txt
            sevenhourteacher-domain-diagnostic.json
            anonymous-admin.html
          retention-days: 14
# Verification target corrected to https://7hourteacher.com, 17 Nov 2026.
